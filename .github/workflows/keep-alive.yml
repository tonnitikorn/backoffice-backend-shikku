# Render's free plan spins the service down after 15 minutes without traffic.
# Pinging /health every 10 minutes keeps it awake (one service running 24/7 fits in the free 750 h/month).
name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://shikkulens-api.onrender.com/health
